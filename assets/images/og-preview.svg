<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF5757" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292929" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Logo Monogram -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="14" fill="#161616" stroke="#292929" stroke-width="2"/>
    <text x="32" y="44" font-family="'Inter', sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#FFFFFF">
      A<tspan fill="#FF5757">M</tspan>
    </text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(100, 240)">
    <text font-family="'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#FF5757">
      PORTFOLIO &bull; LUCKNOW, INDIA
    </text>
    <text y="70" font-family="'Inter', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">
      Ayush Kumar Mishra
    </text>
    <text y="130" font-family="'Inter', sans-serif" font-size="36" font-weight="700" fill="#B3B3B3">
      Web Developer
    </text>
    <text y="185" font-family="'Inter', sans-serif" font-size="20" fill="#737373">
      HTML5 &bull; CSS3 &bull; JavaScript &bull; React.js &bull; Next.js &bull; Responsive Design
    </text>
  </g>

  <!-- Code Card Preview Element -->
  <g transform="translate(750, 160)">
    <rect width="360" height="320" rx="18" fill="#161616" stroke="#292929" stroke-width="2"/>
    <!-- Dots -->
    <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="28" r="6" fill="#27c93f"/>
    <!-- Code text -->
    <text x="28" y="75" font-family="monospace" font-size="13" fill="#6272a4">// Verified Experience</text>
    <text x="28" y="105" font-family="monospace" font-size="14" fill="#ff79c6">const <tspan fill="#50fa7b">experience</tspan> = {</text>
    <text x="45" y="135" font-family="monospace" font-size="13" fill="#8be9fd">company: <tspan fill="#f1fa8c">"Shine Infosolutions"</tspan>,</text>
    <text x="45" y="165" font-family="monospace" font-size="13" fill="#8be9fd">role: <tspan fill="#f1fa8c">"Web Developer Intern"</tspan>,</text>
    <text x="45" y="195" font-family="monospace" font-size="13" fill="#8be9fd">duration: <tspan fill="#f1fa8c">"August 2026 – Present"</tspan>,</text>
    <text x="45" y="225" font-family="monospace" font-size="13" fill="#8be9fd">status: <tspan fill="#50fa7b">"Active (Ongoing)"</tspan></text>
    <text x="28" y="255" font-family="monospace" font-size="14" fill="#ff79c6">};</text>
  </g>
</svg>
